# El plugin oficial de Next.js se encarga del build, del directorio de salida
# y de mapear las rutas de /app/api a funciones serverless.
# No hay que declarar `publish`: la combinación de publish=".next" con
# output:"standalone" era justamente lo que rompía los deploys.

[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
  NEXT_TELEMETRY_DISABLED = "1"
